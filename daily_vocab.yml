name: Daily Spanish Vocab

on:
  schedule:
    - cron: "0 0 * * *"    # UTC 00:00 = 台灣 08:00 早上
    - cron: "30 9 * * *"   # UTC 09:30 = 台灣 17:30 下午
  workflow_dispatch:
    inputs:
      slot:
        description: "手動測試要跑哪個時段"
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: write   # 允許 commit 單字庫回 repo

jobs:
  push-vocab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Decide slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "value=morning" >> $GITHUB_OUTPUT
          else
            echo "value=evening" >> $GITHUB_OUTPUT
          fi

      - name: Run vocab push
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLOT: ${{ steps.slot.outputs.value }}
        run: python daily_vocab.py

      - name: Commit updated library
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add vocab_library.json last_batches.json docs/vocab.json 2>/dev/null || true
          git commit -m "Update vocab library [skip ci]" || echo "no change"
          git push || echo "push skipped"
