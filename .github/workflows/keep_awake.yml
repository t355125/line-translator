name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分鐘
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render to prevent sleep
        run: |
          echo "Pinging Render..."
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            https://line-translator-biar.onrender.com/ || echo "ping failed (non-fatal)"
